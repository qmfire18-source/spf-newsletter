{# Blason si le fichier a été déposé dans src/app/static/, monogramme sinon.
   On ne reproduit pas le blason en SVG : une approximation vaut moins que
   l'absence, et les règles d'usage d'un logo interdisent de le redessiner. #}
{% if logo_url %}
  <img class="brand__logo" src="{{ logo_url }}" alt="Logo Sciences Po Finance">
{% else %}
  <svg class="brand__mark" viewBox="0 0 40 40" role="img"
       aria-label="Sciences Po Finance">
    <rect width="40" height="40" rx="7" fill="#183050"/>
    <text x="20" y="26" text-anchor="middle" fill="#fff"
          font-family="Newsreader, Georgia, serif" font-size="15"
          font-weight="600" letter-spacing="1">SPF</text>
  </svg>
{% endif %}
