{# Gabarit commun : identité, palette, typographie. #}
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Newsletter SPF{% endblock %}</title>
  {# Le blason plutôt que l'initiale grise que le navigateur invente. #}
  <link rel="icon" href="/static/logo.jpeg">
  <link rel="apple-touch-icon" href="/static/logo.jpeg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700&family=Newsreader:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    /* Palette : marine institutionnel, repris du blason de l'association. */
    :root {
      --navy:#183050; --navy-700:#122740; --navy-300:#44628A;
      --bg:#F6F7F9; --surface:#FFFFFF; --surface-2:#F1F3F6;
      --fg:#0F172A; --fg-muted:#55607A; --border:#DFE3EA;
      --danger:#B42318; --danger-bg:#FEF3F2;
      --ok:#0B6B4F; --ok-bg:#ECFDF3;
      --ring:#183050;
      --radius:10px; --radius-sm:6px;
      --shadow:0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06);
      --sans:"Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
      --serif:"Newsreader", Georgia, "Times New Roman", serif;
      /* Le nom de l'association, à côté du blason, suit la sans-serif du
         site Canva plutôt que la serif éditoriale du reste. */
      --marque:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      --mono:ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --navy:#1D3A5C; --navy-700:#1b3757; --navy-300:#8AA9CE;
        --bg:#0B1220; --surface:#121A2A; --surface-2:#182134;
        --fg:#E8ECF4; --fg-muted:#9AA6BF; --border:#26314A;
        --danger:#FF7A70; --danger-bg:#2A1614;
        --ok:#5FD9A6; --ok-bg:#10241C;
        --ring:#8AA9CE;
        --shadow:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
        color-scheme: dark;
      }
    }
    *,*::before,*::after { box-sizing:border-box; }
    body {
      margin:0; background:var(--bg); color:var(--fg);
      font-family:var(--sans); font-size:16px; line-height:1.6;
      -webkit-font-smoothing:antialiased;
    }
    a { color:var(--navy); }
    @media (prefers-color-scheme: dark) { a { color:var(--navy-300); } }

    /* --- identité --- */
    .brand { display:flex; align-items:center; gap:.75rem; min-width:0; }
    .brand__logo { width:38px; height:38px; flex:none; border-radius:7px;
                   object-fit:contain; background:#fff; }
    .brand__mark { width:38px; height:38px; flex:none; }
    .brand__name { font-family:var(--marque); font-weight:600; font-size:1.05rem;
                   letter-spacing:-.01em;
                   letter-spacing:.01em; line-height:1.15; }
    .brand__sub { font-size:.76rem; color:var(--fg-muted); letter-spacing:.04em;
                  text-transform:uppercase; }
    .brand--onnavy .brand__name { color:#fff; }
    .brand--onnavy .brand__sub { color:#C4D3E8; }

    /* --- contrôles --- */
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:.5rem;
      min-height:44px; padding:.6rem 1.15rem; border:1px solid transparent;
      border-radius:var(--radius-sm); font:inherit; font-weight:500;
      cursor:pointer; text-decoration:none;
      transition:background-color .18s ease, border-color .18s ease, color .18s ease;
    }
    .btn:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible,
    button:focus-visible { outline:3px solid var(--ring); outline-offset:2px; }
    .btn--primary { background:var(--navy); color:#fff; }
    .btn--primary:hover { background:var(--navy-700); }
    .btn--ghost { background:transparent; color:var(--fg); border-color:var(--border); }
    .btn--ghost:hover { background:var(--surface-2); }
    .btn--danger { background:var(--danger); color:#fff; }
    .btn--danger:hover { filter:brightness(.92); }
    .btn[disabled] { opacity:.45; cursor:not-allowed; }

    .flash { display:flex; gap:.6rem; align-items:flex-start; padding:.8rem 1rem;
             border-radius:var(--radius-sm); margin:0 0 1rem; font-size:.94rem;
             border:1px solid transparent; }
    .flash svg { flex:none; margin-top:.15rem; }
    .flash--ok { background:var(--ok-bg); color:var(--ok); border-color:currentColor; }
    .flash--error { background:var(--danger-bg); color:var(--danger); border-color:currentColor; }

    @media (prefers-reduced-motion: reduce) {
      *,*::before,*::after { transition-duration:.01ms !important; animation-duration:.01ms !important; }
    }
    {% block style %}{% endblock %}

    /* ---------- curseur ----------
       Le même que sur la page d'abonnement. Les zones où l'on écrit gardent
       leur barre de saisie : perdre le point d'insertion en corrigeant un
       texte coûterait bien plus que l'effet ne rapporte. */
    .curseur, .curseur__anneau { display:none; }
    @media (pointer:fine) {
      html.curseur-actif, html.curseur-actif * { cursor:none; }
      html.curseur-actif [contenteditable="true"],
      html.curseur-actif input, html.curseur-actif textarea { cursor:text; }

      .curseur, .curseur__anneau {
        display:block; position:fixed; top:0; left:0; z-index:9999;
        pointer-events:none; border-radius:50%;
        transform:translate3d(-100px,-100px,0);
      }
      .curseur { width:7px; height:7px; margin:-3.5px 0 0 -3.5px;
                 background:#2E6BB0; }
      .curseur__anneau { width:34px; height:34px; margin:-17px 0 0 -17px;
                         border:1.5px solid #2E6BB0; opacity:.55;
                         transition:width .22s ease, height .22s ease,
                                    margin .22s ease, opacity .22s ease,
                                    background-color .22s ease; }
      .curseur__anneau.survol { width:52px; height:52px; margin:-26px 0 0 -26px;
                                opacity:.9; background:rgba(46,107,176,.12); }
      /* Sur le bandeau marine, le bleu se fond dans le fond. */
      .curseur.sur-marine { background:#AECDEB; }
      .curseur__anneau.sur-marine { border-color:#AECDEB; opacity:.75; }
    }
  </style>
</head>
<body>
{% block body %}{% endblock %}
<script>
  // Curseur : un point exact, un anneau qui traîne. Le retard se calcule à
  // chaque image plutôt qu'en CSS, pour que l'anneau s'élargisse à la vitesse
  // du geste et non à son arrivée.
  (function () {
    if (!window.matchMedia("(pointer:fine)").matches) return;
    // Le réglage d'accessibilité supprime le retard et l'élan, pas le
    // curseur : c'est le mouvement qui gêne, pas la forme.
    var animationOk = window.matchMedia("(prefers-reduced-motion:no-preference)").matches;

    var point = document.createElement("div");
    var anneau = document.createElement("div");
    point.className = "curseur";
    anneau.className = "curseur__anneau";
    document.body.append(point, anneau);
    document.documentElement.classList.add("curseur-actif");

    var sourisX = 0, sourisY = 0, anneauX = 0, anneauY = 0, vitesse = 0;
    var bandeau = document.querySelector(".topbar");

    document.addEventListener("mousemove", function (e) {
      var dx = e.clientX - sourisX, dy = e.clientY - sourisY;
      vitesse = Math.min(Math.hypot(dx, dy), 60);
      sourisX = e.clientX; sourisY = e.clientY;
      point.style.transform = "translate3d(" + sourisX + "px," + sourisY + "px,0)";
      if (bandeau) {
        var bornes = bandeau.getBoundingClientRect();
        var dedans = e.clientY >= bornes.top && e.clientY <= bornes.bottom;
        point.classList.toggle("sur-marine", dedans);
        anneau.classList.toggle("sur-marine", dedans);
      }
    });

    (function suivre() {
      var inertie = animationOk ? 6 : 1;   // 1 = l'anneau colle au point
      anneauX += (sourisX - anneauX) / inertie;
      anneauY += (sourisY - anneauY) / inertie;
      vitesse *= 0.9;
      var echelle = animationOk ? 1 + Math.min(vitesse / 60, 1) * 0.6 : 1;
      anneau.style.transform =
        "translate3d(" + anneauX + "px," + anneauY + "px,0) scale(" + echelle + ")";
      requestAnimationFrame(suivre);
    })();

    document.querySelectorAll("a, button, summary, .tool").forEach(function (el) {
      el.addEventListener("mouseenter", function () { anneau.classList.add("survol"); });
      el.addEventListener("mouseleave", function () { anneau.classList.remove("survol"); });
    });
  })();
</script>
</body>
</html>
